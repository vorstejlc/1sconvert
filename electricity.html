ient(ellipse 50% 40% at 80% 70%,${rgba(t.bg2)} 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 60% 10%,${rgba(t.bg3)} 0%,transparent 60%)}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}.nav-logo .logo-mark{background:linear-gradient(135deg,${rgb(t.accent)},${rgb(t.accent2)})}.tab.active{background:${rgb(t.accent)};border-color:${rgb(t.accent)}}.tab:hover,input:focus,select:focus{border-color:${rgb(t.accent)}!important}.page-header .eyebrow,.formula-bar .f-label,.nav-links a.active{color:${rgb(t.accent)}}.nav-links a.active{background:rgba(${t.accent[0]},${t.accent[1]},${t.accent[2]},0.1)}.copy-pip{background:${rgb(t.accent)}}`;document.head.appendChild(s);})();

<script>
const ALL_UNITS = {
  voltage: [
    { key:'uv',  sym:'μV',  name:'Microvolt',   toBase:1e-6   },
    { key:'mv',  sym:'mV',  name:'Millivolt',   toBase:0.001  },
    { key:'v',   sym:'V',   name:'Volt',        toBase:1      },
    { key:'kv',  sym:'kV',  name:'Kilovolt',    toBase:1000   },
    { key:'Mv',  sym:'MV',  name:'Megavolt',    toBase:1e6    },
  ],
  current: [
    { key:'ua',  sym:'μA',  name:'Microampere', toBase:1e-6   },
    { key:'ma',  sym:'mA',  name:'Milliampere', toBase:0.001  },
    { key:'a',   sym:'A',   name:'Ampere',      toBase:1      },
    { key:'ka',  sym:'kA',  name:'Kiloampere',  toBase:1000   },
  ],
  resistance: [
    { key:'mo',  sym:'mΩ',  name:'Milliohm',    toBase:0.001  },
    { key:'o',   sym:'Ω',   name:'Ohm',         toBase:1      },
    { key:'ko',  sym:'kΩ',  name:'Kilohm',      toBase:1000   },
    { key:'Mo',  sym:'MΩ',  name:'Megohm',      toBase:1e6    },
    { key:'Go',  sym:'GΩ',  name:'Gigaohm',     toBase:1e9    },
  ],
  charge: [
    { key:'uc',  sym:'μC',  name:'Microcoulomb',toBase:1e-6   },
    { key:'mc',  sym:'mC',  name:'Millicoulomb',toBase:0.001  },
    { key:'c',   sym:'C',   name:'Coulomb',     toBase:1      },
    { key:'kc',  sym:'kC',  name:'Kilocoulomb', toBase:1000   },
    { key:'ah',  sym:'Ah',  name:'Ampere-hour', toBase:3600   },
    { key:'mah', sym:'mAh', name:'Milliamp-hour',toBase:3.6   },
  ],
  capacitance: [
    { key:'pf',  sym:'pF',  name:'Picofarad',   toBase:1e-12  },
    { key:'nf',  sym:'nF',  name:'Nanofarad',   toBase:1e-9   },
    { key:'uf',  sym:'μF',  name:'Microfarad',  toBase:1e-6   },
    { key:'mf',  sym:'mF',  name:'Millifarad',  toBase:0.001  },
    { key:'f',   sym:'F',   name:'Farad',       toBase:1      },
  ],
};
const BASE_LABELS = { voltage:'V', current:'A', resistance:'Ω', charge:'C', capacitance:'F' };
let cat = 'voltage';
const sel=document.getElementById('unit-sel'),inp=document.getElementById('val-input'),grid=document.getElementById('results'),formula=document.getElementById('formula');

function populateSel() {
  sel.innerHTML='';
  ALL_UNITS[cat].forEach(u=>{const o=document.createElement('option');o.value=u.key;o.textContent=`${u.sym} — ${u.name}`;sel.appendChild(o);});
  sel.value=ALL_UNITS[cat][Math.floor(ALL_UNITS[cat].length/2)].key;
}
function fmt(n){if(n===0)return'0';const a=Math.abs(n);if(a>=1e15||a<1e-15)return n.toExponential(4);if(a>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:4});return parseFloat(n.toPrecision(7)).toString();}
let ct;
function render(){
  const v=parseFloat(inp.value)||0;
  const units=ALL_UNITS[cat];
  const from=units.find(u=>u.key===sel.value)||units[0];
  const base=v*from.toBase;
  grid.innerHTML='';
  units.forEach(u=>{if(u.key===from.key)return;const cv=base/u.toBase;const card=document.createElement('div');card.className='result-card';card.innerHTML=`<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;card.onclick=()=>{navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});card.classList.add('copied');clearTimeout(ct);ct=setTimeout(()=>card.classList.remove('copied'),1100);};grid.appendChild(card);});
  formula.textContent=`1 ${from.sym} = ${fmt(from.toBase)} ${BASE_LABELS[cat]}`;
}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');cat=t.dataset.cat;populateSel();render();});
inp.addEventListener('input',render);sel.addEventListener('change',render);
populateSel();render();
</script>
