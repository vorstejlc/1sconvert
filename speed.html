<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Converter — km/h, mph, m/s, Knots, Mach & Speed of Light | 1 Step Converter</title>
<meta name="description" content="Convert speed units in one step: kilometres per hour, miles per hour, metres per second, knots, Mach number, and speed of light. Fast and accurate speed converter.">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo"><span class="logo-mark">1S</span>1 Step Converter</a>
  <div class="nav-links">
    <a href="length.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temp</a>
    <a href="speed.html" class="active">Speed</a>
    <a href="area.html">Area</a>
    <a href="volume.html">Volume</a>
    <a href="cooking.html">Cooking</a>
    <a href="data.html">Data</a>
    <a href="pressure.html">Pressure</a>
  </div>
</nav>

<main class="page-wrap">
  <div class="page-header animate-in">
    <span class="eyebrow">🚀 Speed</span>
    <h1>Speed Converter</h1>
    <p class="sub">8 units · everyday to relativistic</p>
  </div>

  <div class="card animate-in delay-1">
    <div class="input-row">
      <div>
        <label class="field-label" for="val-input">Value</label>
        <input type="number" id="val-input" value="100" step="any" placeholder="0">
      </div>
      <div>
        <label class="field-label" for="unit-sel">From</label>
        <select id="unit-sel"></select>
      </div>
    </div>

    <div class="divider">results</div>
    <div class="results-grid" id="results"></div>

    <div class="formula-bar">
      <span class="f-label">formula</span>
      <span id="formula">—</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 1 Step Converter</p>
  <a href="index.html">← All Converters</a>
</footer>

<script>
// All stored as m/s
const UNITS = [
  { key:'ms',   sym:'m/s',   name:'Metres per Second',      toMs:1            },
  { key:'kmh',  sym:'km/h',  name:'Kilometres per Hour',    toMs:1/3.6        },
  { key:'mph',  sym:'mph',   name:'Miles per Hour',         toMs:0.44704      },
  { key:'kn',   sym:'kn',    name:'Knot',                   toMs:0.514444     },
  { key:'fts',  sym:'ft/s',  name:'Feet per Second',        toMs:0.3048       },
  { key:'mach', sym:'Mach',  name:'Mach (at sea level)',    toMs:343          },
  { key:'c',    sym:'c',     name:'Speed of Light',         toMs:299792458    },
  { key:'kms',  sym:'km/s',  name:'Kilometres per Second',  toMs:1000         },
];

const sel = document.getElementById('unit-sel');
const inp = document.getElementById('val-input');
const grid = document.getElementById('results');
const formula = document.getElementById('formula');

UNITS.forEach(u => {
  const o = document.createElement('option');
  o.value = u.key; o.textContent = `${u.sym} — ${u.name}`;
  sel.appendChild(o);
});
sel.value = 'kmh';

function fmt(n) {
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e12 || a < 1e-9) return n.toExponential(4);
  if (a >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits:5});
  return parseFloat(n.toPrecision(7)).toString();
}

let ct;
function render() {
  const v = parseFloat(inp.value) || 0;
  const from = UNITS.find(u => u.key === sel.value);
  const ms = v * from.toMs;
  grid.innerHTML = '';
  UNITS.forEach(u => {
    if (u.key === from.key) return;
    const cv = ms / u.toMs;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;
    card.onclick = () => {
      navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});
      card.classList.add('copied'); clearTimeout(ct);
      ct = setTimeout(() => card.classList.remove('copied'), 1100);
    };
    grid.appendChild(card);
  });
  formula.textContent = `1 ${from.sym} = ${fmt(from.toMs)} m/s`;
}

inp.addEventListener('input', render);
sel.addEventListener('change', render);
render();
</script>
</body>
</html>
