<script>
// All in kg/m³
const UNITS = [
  { key:'kgm3',  sym:'kg/m³',   name:'Kilogram per Cubic Meter', toBase:1          },
  { key:'gm3',   sym:'g/m³',    name:'Gram per Cubic Meter',     toBase:0.001      },
  { key:'gcm3',  sym:'g/cm³',   name:'Gram per Cubic Centimeter',toBase:1000       },
  { key:'gml',   sym:'g/mL',    name:'Gram per Millilitre',      toBase:1000       },
  { key:'kgl',   sym:'kg/L',    name:'Kilogram per Litre',       toBase:1000       },
  { key:'lbft3', sym:'lb/ft³',  name:'Pound per Cubic Foot',     toBase:16.01846   },
  { key:'lbin3', sym:'lb/in³',  name:'Pound per Cubic Inch',     toBase:27679.9    },
  { key:'ozin3', sym:'oz/in³',  name:'Ounce per Cubic Inch',     toBase:1729.99    },
];
const sel=document.getElementById('unit-sel'),inp=document.getElementById('val-input'),grid=document.getElementById('results'),formula=document.getElementById('formula');
UNITS.forEach(u=>{const o=document.createElement('option');o.value=u.key;o.textContent=`${u.sym} — ${u.name}`;sel.appendChild(o);}); sel.value='kgm3';
function fmt(n){if(n===0)return'0';const a=Math.abs(n);if(a>=1e10||a<1e-9)return n.toExponential(4);if(a>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:4});return parseFloat(n.toPrecision(7)).toString();}
let ct;
function render(){const v=parseFloat(inp.value)||0;const from=UNITS.find(u=>u.key===sel.value);const base=v*from.toBase;grid.innerHTML='';UNITS.forEach(u=>{if(u.key===from.key)return;const cv=base/u.toBase;const card=document.createElement('div');card.className='result-card';card.innerHTML=`<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;card.onclick=()=>{navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});card.classList.add('copied');clearTimeout(ct);ct=setTimeout(()=>card.classList.remove('copied'),1100);};grid.appendChild(card);});formula.textContent=`1 ${from.sym} = ${fmt(from.toBase)} kg/m³`;}
inp.addEventListener('input',render);sel.addEventListener('change',render);render();
</script>
