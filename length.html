<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Converter — mm, cm, m, km, ft, in, mi & More | 1 Step Converter</title>
<meta name="description" content="Instantly convert between millimeters, centimeters, meters, kilometers, inches, feet, yards, miles, nautical miles, and astronomical units. Free length converter with 15 units.">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo"><span class="logo-mark">1S</span>1 Step Converter</a>
  <div class="nav-links">
    <a href="length.html" class="active">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temp</a>
    <a href="speed.html">Speed</a>
    <a href="area.html">Area</a>
    <a href="volume.html">Volume</a>
    <a href="cooking.html">Cooking</a>
    <a href="data.html">Data</a>
    <a href="pressure.html">Pressure</a>
  </div>
</nav>

<main class="page-wrap">
  <div class="page-header animate-in">
    <span class="eyebrow">📏 Length</span>
    <h1>Length Converter</h1>
    <p class="sub">15 units · metric, imperial &amp; astronomical</p>
  </div>

  <div class="card animate-in delay-1">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all">All</button>
      <button class="tab" data-cat="metric">Metric</button>
      <button class="tab" data-cat="imperial">Imperial</button>
      <button class="tab" data-cat="astro">Astronomical</button>
    </div>

    <div class="input-row">
      <div>
        <label class="field-label" for="val-input">Value</label>
        <input type="number" id="val-input" value="1" step="any" placeholder="0">
      </div>
      <div>
        <label class="field-label" for="unit-sel">From</label>
        <select id="unit-sel"></select>
      </div>
    </div>

    <div class="divider">results</div>
    <div class="results-grid" id="results"></div>

    <div class="formula-bar">
      <span class="f-label">formula</span>
      <span id="formula">—</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 1 Step Converter</p>
  <a href="index.html">← All Converters</a>
</footer>

<script>
const UNITS = [
  { key:'pm',  sym:'pm',  name:'Picometer',          toM:1e-12,   cat:'metric' },
  { key:'nm',  sym:'nm',  name:'Nanometer',           toM:1e-9,    cat:'metric' },
  { key:'um',  sym:'μm',  name:'Micrometer',          toM:1e-6,    cat:'metric' },
  { key:'mm',  sym:'mm',  name:'Millimeter',          toM:0.001,   cat:'metric' },
  { key:'cm',  sym:'cm',  name:'Centimeter',          toM:0.01,    cat:'metric' },
  { key:'m',   sym:'m',   name:'Meter',               toM:1,       cat:'metric' },
  { key:'km',  sym:'km',  name:'Kilometer',           toM:1000,    cat:'metric' },
  { key:'in',  sym:'in',  name:'Inch',                toM:0.0254,  cat:'imperial' },
  { key:'ft',  sym:'ft',  name:'Foot',                toM:0.3048,  cat:'imperial' },
  { key:'yd',  sym:'yd',  name:'Yard',                toM:0.9144,  cat:'imperial' },
  { key:'mi',  sym:'mi',  name:'Mile',                toM:1609.344,cat:'imperial' },
  { key:'nmi', sym:'nmi', name:'Nautical Mile',       toM:1852,    cat:'imperial' },
  { key:'au',  sym:'AU',  name:'Astronomical Unit',   toM:1.496e11,cat:'astro' },
  { key:'ly',  sym:'ly',  name:'Light Year',          toM:9.461e15,cat:'astro' },
  { key:'pc',  sym:'pc',  name:'Parsec',              toM:3.086e16,cat:'astro' },
];

let cat = 'all';
const sel = document.getElementById('unit-sel');
const inp = document.getElementById('val-input');
const grid = document.getElementById('results');
const formula = document.getElementById('formula');

UNITS.forEach(u => {
  const o = document.createElement('option');
  o.value = u.key; o.textContent = `${u.sym} — ${u.name}`;
  sel.appendChild(o);
});
sel.value = 'm';

function fmt(n) {
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e15 || a < 1e-9) return n.toExponential(4);
  if (a >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits:4});
  return parseFloat(n.toPrecision(7)).toString();
}

let copyTimer;
function render() {
  const v = parseFloat(inp.value) || 0;
  const from = UNITS.find(u => u.key === sel.value);
  const meters = v * from.toM;
  const show = cat === 'all' ? UNITS : UNITS.filter(u => u.cat === cat);
  grid.innerHTML = '';
  show.forEach(u => {
    if (u.key === from.key) return;
    const cv = meters / u.toM;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;
    card.onclick = () => {
      navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});
      card.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => card.classList.remove('copied'), 1100);
    };
    grid.appendChild(card);
  });
  formula.textContent = `1 ${from.sym} = ${fmt(from.toM)} m`;
}

inp.addEventListener('input', render);
sel.addEventListener('change', render);
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); cat = t.dataset.cat; render();
});

render();
</script>
</body>
</html>
