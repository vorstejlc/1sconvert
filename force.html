<script>
// All in Newtons
const UNITS = [
  { key:'n',    sym:'N',    name:'Newton',           toN:1           },
  { key:'kn',   sym:'kN',   name:'Kilonewton',       toN:1000        },
  { key:'mn',   sym:'MN',   name:'Meganewton',       toN:1e6         },
  { key:'dyn',  sym:'dyn',  name:'Dyne',             toN:0.00001     },
  { key:'kgf',  sym:'kgf',  name:'Kilogram-force',   toN:9.80665     },
  { key:'gf',   sym:'gf',   name:'Gram-force',       toN:0.00980665  },
  { key:'lbf',  sym:'lbf',  name:'Pound-force',      toN:4.4482216   },
  { key:'pdl',  sym:'pdl',  name:'Poundal',          toN:0.138255    },
];
const sel=document.getElementById('unit-sel'),inp=document.getElementById('val-input'),grid=document.getElementById('results'),formula=document.getElementById('formula');
UNITS.forEach(u=>{const o=document.createElement('option');o.value=u.key;o.textContent=`${u.sym} — ${u.name}`;sel.appendChild(o);}); sel.value='n';
function fmt(n){if(n===0)return'0';const a=Math.abs(n);if(a>=1e12||a<1e-9)return n.toExponential(4);if(a>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:4});return parseFloat(n.toPrecision(7)).toString();}
let ct;
function render(){const v=parseFloat(inp.value)||0;const from=UNITS.find(u=>u.key===sel.value);const n=v*from.toN;grid.innerHTML='';UNITS.forEach(u=>{if(u.key===from.key)return;const cv=n/u.toN;const card=document.createElement('div');card.className='result-card';card.innerHTML=`<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;card.onclick=()=>{navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});card.classList.add('copied');clearTimeout(ct);ct=setTimeout(()=>card.classList.remove('copied'),1100);};grid.appendChild(card);});formula.textContent=`1 ${from.sym} = ${fmt(from.toN)} N`;}
inp.addEventListener('input',render);sel.addEventListener('change',render);render();
</script>
