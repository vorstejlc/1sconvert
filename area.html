<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Converter — m², km², Acres, Hectares, ft², mi² & More | 1 Step Converter</title>
<meta name="description" content="Convert area units instantly: square meters, square kilometres, hectares, acres, square feet, square miles, square yards and more. Perfect for real estate, land and geography.">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo"><span class="logo-mark">1S</span>1 Step Converter</a>
  <div class="nav-links">
    <a href="length.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temp</a>
    <a href="speed.html">Speed</a>
    <a href="area.html" class="active">Area</a>
    <a href="volume.html">Volume</a>
    <a href="cooking.html">Cooking</a>
    <a href="data.html">Data</a>
    <a href="pressure.html">Pressure</a>
  </div>
</nav>

<main class="page-wrap">
  <div class="page-header animate-in">
    <span class="eyebrow">🗺️ Area</span>
    <h1>Area Converter</h1>
    <p class="sub">11 units · metric, imperial &amp; land</p>
  </div>

  <div class="card animate-in delay-1">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all">All</button>
      <button class="tab" data-cat="metric">Metric</button>
      <button class="tab" data-cat="imperial">Imperial</button>
    </div>

    <div class="input-row">
      <div>
        <label class="field-label" for="val-input">Value</label>
        <input type="number" id="val-input" value="1" step="any" placeholder="0">
      </div>
      <div>
        <label class="field-label" for="unit-sel">From</label>
        <select id="unit-sel"></select>
      </div>
    </div>

    <div class="divider">results</div>
    <div class="results-grid" id="results"></div>

    <div class="formula-bar">
      <span class="f-label">formula</span>
      <span id="formula">—</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 1 Step Converter</p>
  <a href="index.html">← All Converters</a>
</footer>

<script>
// All stored as m²
const UNITS = [
  { key:'mm2', sym:'mm²',  name:'Square Millimeter',  toM2:1e-6,         cat:'metric' },
  { key:'cm2', sym:'cm²',  name:'Square Centimeter',  toM2:0.0001,       cat:'metric' },
  { key:'m2',  sym:'m²',   name:'Square Meter',       toM2:1,            cat:'metric' },
  { key:'ha',  sym:'ha',   name:'Hectare',             toM2:10000,        cat:'metric' },
  { key:'km2', sym:'km²',  name:'Square Kilometer',   toM2:1e6,          cat:'metric' },
  { key:'in2', sym:'in²',  name:'Square Inch',        toM2:0.00064516,   cat:'imperial' },
  { key:'ft2', sym:'ft²',  name:'Square Foot',        toM2:0.09290304,   cat:'imperial' },
  { key:'yd2', sym:'yd²',  name:'Square Yard',        toM2:0.83612736,   cat:'imperial' },
  { key:'ac',  sym:'ac',   name:'Acre',               toM2:4046.8564224, cat:'imperial' },
  { key:'mi2', sym:'mi²',  name:'Square Mile',        toM2:2589988.11,   cat:'imperial' },
  { key:'ro',  sym:'ro',   name:'Rood',               toM2:1011.7141056, cat:'imperial' },
];

let cat = 'all';
const sel = document.getElementById('unit-sel');
const inp = document.getElementById('val-input');
const grid = document.getElementById('results');
const formula = document.getElementById('formula');

UNITS.forEach(u => {
  const o = document.createElement('option');
  o.value = u.key; o.textContent = `${u.sym} — ${u.name}`;
  sel.appendChild(o);
});
sel.value = 'm2';

function fmt(n) {
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e12 || a < 1e-9) return n.toExponential(4);
  if (a >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits:4});
  return parseFloat(n.toPrecision(7)).toString();
}

let ct;
function render() {
  const v = parseFloat(inp.value) || 0;
  const from = UNITS.find(u => u.key === sel.value);
  const m2 = v * from.toM2;
  const show = cat === 'all' ? UNITS : UNITS.filter(u => u.cat === cat);
  grid.innerHTML = '';
  show.forEach(u => {
    if (u.key === from.key) return;
    const cv = m2 / u.toM2;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;
    card.onclick = () => {
      navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});
      card.classList.add('copied'); clearTimeout(ct);
      ct = setTimeout(() => card.classList.remove('copied'), 1100);
    };
    grid.appendChild(card);
  });
  formula.textContent = `1 ${from.sym} = ${fmt(from.toM2)} m²`;
}

inp.addEventListener('input', render);
sel.addEventListener('change', render);
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); cat = t.dataset.cat; render();
});
render();
</script>
</body>
</html>
