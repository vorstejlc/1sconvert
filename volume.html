<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Converter — Litres, Gallons, ml, fl oz, Cubic Meters | 1 Step Converter</title>
<meta name="description" content="Convert volume units instantly: millilitres, litres, fluid ounces, cups, pints, quarts, gallons and cubic meters. Supports both US and UK (imperial) measurements.">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo"><span class="logo-mark">1S</span>1 Step Converter</a>
  <div class="nav-links">
    <a href="length.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temp</a>
    <a href="speed.html">Speed</a>
    <a href="area.html">Area</a>
    <a href="volume.html" class="active">Volume</a>
    <a href="cooking.html">Cooking</a>
    <a href="data.html">Data</a>
    <a href="pressure.html">Pressure</a>
  </div>
</nav>

<main class="page-wrap">
  <div class="page-header animate-in">
    <span class="eyebrow">🫙 Volume</span>
    <h1>Volume Converter</h1>
    <p class="sub">13 units · metric, US &amp; imperial</p>
  </div>

  <div class="card animate-in delay-1">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all">All</button>
      <button class="tab" data-cat="metric">Metric</button>
      <button class="tab" data-cat="us">US</button>
      <button class="tab" data-cat="uk">UK Imperial</button>
    </div>

    <div class="input-row">
      <div>
        <label class="field-label" for="val-input">Value</label>
        <input type="number" id="val-input" value="1" step="any" placeholder="0">
      </div>
      <div>
        <label class="field-label" for="unit-sel">From</label>
        <select id="unit-sel"></select>
      </div>
    </div>

    <div class="divider">results</div>
    <div class="results-grid" id="results"></div>

    <div class="formula-bar">
      <span class="f-label">formula</span>
      <span id="formula">—</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 1 Step Converter</p>
  <a href="index.html">← All Converters</a>
</footer>

<script>
// All stored as litres
const UNITS = [
  { key:'ml',    sym:'mL',    name:'Millilitre',           toL:0.001,       cat:'metric' },
  { key:'cl',    sym:'cL',    name:'Centilitre',           toL:0.01,        cat:'metric' },
  { key:'l',     sym:'L',     name:'Litre',                toL:1,           cat:'metric' },
  { key:'m3',    sym:'m³',    name:'Cubic Meter',          toL:1000,        cat:'metric' },
  { key:'cm3',   sym:'cm³',   name:'Cubic Centimeter',     toL:0.001,       cat:'metric' },
  { key:'usfloz',sym:'fl oz', name:'US Fluid Ounce',       toL:0.0295735,   cat:'us' },
  { key:'uscup', sym:'cup',   name:'US Cup',               toL:0.236588,    cat:'us' },
  { key:'uspt',  sym:'pt',    name:'US Pint',              toL:0.473176,    cat:'us' },
  { key:'usqt',  sym:'qt',    name:'US Quart',             toL:0.946353,    cat:'us' },
  { key:'usgal', sym:'gal',   name:'US Gallon',            toL:3.785411784, cat:'us' },
  { key:'ukfloz',sym:'uk fl oz',name:'UK Fluid Ounce',     toL:0.0284131,   cat:'uk' },
  { key:'ukpt',  sym:'uk pt', name:'UK Pint',              toL:0.568261,    cat:'uk' },
  { key:'ukgal', sym:'uk gal',name:'UK Gallon',            toL:4.54609,     cat:'uk' },
];

let cat = 'all';
const sel = document.getElementById('unit-sel');
const inp = document.getElementById('val-input');
const grid = document.getElementById('results');
const formula = document.getElementById('formula');

UNITS.forEach(u => {
  const o = document.createElement('option');
  o.value = u.key; o.textContent = `${u.sym} — ${u.name}`;
  sel.appendChild(o);
});
sel.value = 'l';

function fmt(n) {
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e10 || a < 1e-7) return n.toExponential(4);
  if (a >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits:4});
  return parseFloat(n.toPrecision(7)).toString();
}

let ct;
function render() {
  const v = parseFloat(inp.value) || 0;
  const from = UNITS.find(u => u.key === sel.value);
  const litres = v * from.toL;
  const show = cat === 'all' ? UNITS : UNITS.filter(u => u.cat === cat);
  grid.innerHTML = '';
  show.forEach(u => {
    if (u.key === from.key) return;
    const cv = litres / u.toL;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="r-unit">${u.sym}</div><div class="r-value">${fmt(cv)}</div><div class="r-name">${u.name}</div><div class="copy-pip">copied!</div>`;
    card.onclick = () => {
      navigator.clipboard?.writeText(fmt(cv)).catch(()=>{});
      card.classList.add('copied'); clearTimeout(ct);
      ct = setTimeout(() => card.classList.remove('copied'), 1100);
    };
    grid.appendChild(card);
  });
  formula.textContent = `1 ${from.sym} = ${fmt(from.toL)} L`;
}

inp.addEventListener('input', render);
sel.addEventListener('change', render);
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); cat = t.dataset.cat; render();
});
render();
</script>
</body>
</html>
